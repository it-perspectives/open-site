name: Validate OpenSite
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run release:prepare
      - run: node scripts/smoke-package.js
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: opensite-draft-artifacts
          path: dist/
          if-no-files-found: error
